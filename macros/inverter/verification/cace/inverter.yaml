#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           inverter
description:    Inverter macro on the SkyWater sky130A Open-PDK
PDK:            sky130A

cace_format:    5.2

authorship:
  designer:         Simon Dorrer
  company:          Johannes Kepler University
  creation_date:    May 6, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  VDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.62
    Vmax: 1.98
  VSS:
    description: Analog ground
    type: ground
    direction: inout
  vin:
    description: Inverter input
    type: signal
    direction: input
  vout:
    description: Inverter output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 1.8
  vcm:
    description: Input common-mode voltage
    display: Vcm
    unit: V
    typical: 0.9
  corner_mos:
    description: Process corner (one sky130.lib.spice section, tt_mm adds mismatch)
    display: Corner
    typical: tt
  mc_pr:
    description: Process variation Monte Carlo switch (mc_pr_switch of the model library)
    display: MC process
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: Load capacitance
    display: Cload
    unit: pF
    typical: 10

parameters:
  # The limits are what this design meets: the fixed 0.9 V input bias leaves 2.7 dB and 6.9 dB of gain at the skewed
  # corners sf and fs (the switching point moves to 0.84 V and 0.97 V), mismatch and process Monte Carlo take the
  # cut-off frequency down to 0.80 MHz.
  ac_params:
    spec:
      Adc_ol_dB:
        display: Open-loop dc gain
        description: Small-signal open-loop gain at 10Hz
        unit: dB
        minimum:
          value: 0
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: inverter_tb_ac.sch
        format: ascii
        suffix: .data
        variables: [Adc_ol_dB, fcu]
    plot:
      Adc_ol_dB_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_vcm:
        type: xyplot
        xaxis: vcm
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Adc_ol_dB
        limits: auto
      Adc_ol_dB_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: Adc_ol_dB
        limits: auto
      fcu_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: fcu
        limits: auto
      fcu_vs_vcm:
        type: xyplot
        xaxis: vcm
        yaxis: fcu
        limits: auto
      fcu_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: fcu
        limits: auto
      fcu_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: fcu
        limits: auto
      fcu_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: fcu
        limits: auto
    conditions:
      vdd:
        # minimum: 1.62
        typical: 1.8
        # maximum: 1.98
      vcm:
        # minimum: 0.72
        typical: 0.9
        # maximum: 1.08
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
        # typical: tt
      mc_pr:
        typical: 0
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        #minimum: 1       # 1pF
        typical: 10       # 10pF
        #maximum: 50      # 50pF
  
  ac_mc_params:
    spec:
      Adc_ol_dB:
        display: Open-loop dc gain - Monte Carlo
        description: Small-signal open-loop gain at 10Hz
        unit: dB
        minimum:
          value: 0
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency - Monte Carlo
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: inverter_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Adc_ol_dB, fcu]
        script: inverter_tb_ac.py
        script_variables: [Adc_ol_dB_arr, fcu_arr]
    plot:
      Adc_ol_dB_mc:
        type: histogram
        xaxis: Adc_ol_dB_arr
      fcu_mc:
        type: histogram
        xaxis: fcu_arr
    conditions:
      vdd:
        #minimum: 1.62
        typical: 1.8
        #maximum: 1.98
      vcm:
        #minimum: 0.72
        typical: 0.9
        #maximum: 1.08
      iterations: # for Monte Carlo
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt
      mc_pr:
        typical: 1          # Process variation Monte Carlo
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        #minimum: 1       # 1pF
        typical: 10       # 10pF
        #maximum: 50      # 50pF
        
  ac_mm_params:
    spec:
      Adc_ol_dB:
        display: Open-loop dc gain - Mismatch
        description: Small-signal open-loop gain at 10Hz
        unit: dB
        minimum:
          value: 0
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency - Mismatch
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: inverter_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Adc_ol_dB, fcu]
        script: inverter_tb_ac.py
        script_variables: [Adc_ol_dB_arr, fcu_arr]
    plot:
      Adc_ol_dB_mm:
        type: histogram
        xaxis: Adc_ol_dB_arr
      fcu_mm:
        type: histogram
        xaxis: fcu_arr
    conditions:
      vdd:
        #minimum: 1.62
        typical: 1.8
        #maximum: 1.98
      vcm:
        #minimum: 0.72
        typical: 0.9
        #maximum: 1.08
      iterations: # for Mismatch
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mm      # Mismatch
        # typical: ss_mm
        # typical: ff_mm
        # typical: sf_mm
      mc_pr:
        typical: 0
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        #minimum: 1       # 1pF
        typical: 10       # 10pF
        #maximum: 50      # 50pF